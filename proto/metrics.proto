syntax = "proto3";

package metrics;

option go_package = "github.com/ApplePieAndCrime/go-yandex-metrics/internal/proto";

// Metric определяет единичную метрику.
message Metric {
  string id = 1;

  enum MType {
    GAUGE = 0;
    COUNTER = 1;
  }

  MType type = 2;
  int64 delta = 3;
  double value = 4;
}

// UpdateMetricsRequest содержит список метрик для обновления.
message UpdateMetricsRequest {
  repeated Metric metrics = 1;
}

// UpdateMetricsResponse подтверждает успешное обновление.
message UpdateMetricsResponse {}

// Metrics определяет сервис для работы с метриками.
service Metrics {
  rpc UpdateMetrics(UpdateMetricsRequest) returns (UpdateMetricsResponse);
}
